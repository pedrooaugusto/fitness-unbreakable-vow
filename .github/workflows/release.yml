name: Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      start_date:
        description: "Contract start date:"
        required: true
        type: string
        default: "2025-11-16 09:30:00-03:00"
      seconds_in_one_week:
        description: "Seconds in one week:"
        required: true
        type: number
        default: 120
      number_of_weeks:
        description: "Number of weeks:"
        required: true
        type: string
        default: "5.2"
      network:
        description: "Network to deploy:"
        required: true
        type: choice
        options:
          - arbiSep
          - arbitrum
        default: "arbiSep"
      stake:
        description: "Staked ether:"
        required: true
        type: string
        default: "0.001"
      release_version:
        description: "Release new version?"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  test-contract:
    name: Run Contract Tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: npm ci
      - name: Run Hardhat tests
        run: npm run test

  test-frontend:
    name: Build Frontend
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            @website/package-lock.json
      - name: Install website dependencies
        working-directory: '@website'
        run: npm ci
      - name: Build website
        working-directory: '@website'
        run: npm run build

  deploy-contract-sepolia:
    name: Deploy Contracts (Sepolia)
    needs: 
      - test-contract
      - test-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env for Arbitrum Sepolia deploy
        run: |
          {
            echo "arbiSep.WALLET_PRIVATE_KEY=${{ secrets.ARBITRUM_SEPOLIA_WALLET_PRIVATE_KEY }}";
            echo "arbiSep.RPC_URL=${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}";
            echo "arbitrum.WALLET_PRIVATE_KEY=${{ secrets.ARBITRUM_WALLET_PRIVATE_KEY }}";
            echo "arbitrum.RPC_URL=${{ secrets.ARBITRUM_RPC_URL }}";
            echo "ETHERSCAN_API_KEY=${{ secrets.ETHERSCAN_API_KEY }}";
          } > .env

      - name: Deploy to Arbitrum
        run: |
          chmod +x run.sh
          ./run.sh deploy "${{ inputs.network }}" \
            --startdate "${{ inputs.start_date }}" \
            --secondsinweek "${{ inputs.seconds_in_one_week }}" \
            --durationinweeks "${{ inputs.number_of_weeks }}" \
            --stakedamount "${{ inputs.stake }}"

      - name: Create event saver scheduler args
        run: |
          node -e '
            const path = require("path")
            const fs = require("fs")

            const startDate = parseInt(+new Date("${{ inputs.start_date }}") / 1000)
            const secondsInOneWeek = Number("${{ inputs.seconds_in_one_week }}")
            const numberOfWeeks = Number("${{ inputs.number_of_weeks }}")
            const network = "${{ inputs.network }}"
            const endDate = 60 + startDate + secondsInOneWeek * numberOfWeeks
            const addressesFile = path.join(__dirname, "contracts", ".addresses")

            const contractAddress = fs.readFileSync(addressesFile, "utf8")
              .split("\n")
              .find(a => a.startsWith(network + ".FitnessUnbreakableVow"))
              .split("=")[1]

            console.log("RATE=\"rate("+ parseInt(secondsInOneWeek / 60) +" minutes)\"")
            console.log("START_DATE=\"" + new Date(1000*(startDate + secondsInOneWeek + 2)).toISOString() + "\"")
            console.log("END_DATE=\"" + new Date(1000 * endDate).toISOString() + "\"")
            console.log("CONTRACT_ADDRESS=\"" + contractAddress + "\"")
          ' >> scheduler-args.txt

      - name: Upload contract addresses artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-addresses
          path: contracts/.addresses
          include-hidden-files: true

      - name: Upload scheduler args
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-args
          path: scheduler-args.txt

  update-scheduler:
    name: Update Scheduler
    needs: deploy-contract-sepolia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download scheduler args
        uses: actions/download-artifact@v4
        with:
          name: scheduler-args
          path: scheduler-args

      - name: Configure AWS credentials (OIDC recommended)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure scheduler
        run: |
          source scheduler-args/scheduler-args.txt
          SCHEDULER="save-contract-events"
          LAMBDA_ARN="${{ secrets.SAVE_EVENTS_LAMBDA_ARN }}"
          SCHEDULER_ROLE="${{ secrets.SCHEDULER_ROLE }}"

          aws scheduler update-schedule \
            --name "$SCHEDULER" \
            --schedule-expression "$RATE" \
            --flexible-time-window "Mode=OFF" \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --region us-east-1 \
            --target '{
              "Arn": "'"$LAMBDA_ARN"'",
              "RoleArn": "'"$SCHEDULER_ROLE"'",
              "Input": "{\"contractAddress\":\"'"$CONTRACT_ADDRESS"'\"}"
            }'

  deploy-webapp:
    name: Deploy Frontend
    needs: update-scheduler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download contract addresses artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-addresses
          path: contracts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            @website/package-lock.json

      - name: Install website dependencies
        working-directory: '@website'
        run: npm ci

      - name: Build website
        working-directory: '@website'
        run: |
          mkdir -p public
          cp ../contracts/.addresses public/addresses
          npm run build

      - name: Configure AWS credentials (OIDC recommended)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy static site to S3
        run: |
          chmod +x run.sh
          ./run.sh deploy-webapp

  build-apk:
    name: Build Signed* APK
    needs: deploy-webapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download contract addresses artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-addresses
          path: contracts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Build and sign APK via run.sh
        shell: bash
        run: |
          set -euo pipefail
          # Ensure apksigner from build-tools is on PATH
          export PATH="$ANDROID_SDK_ROOT/build-tools/35.0.0:$PATH"
          chmod +x run.sh @androidapp/app/amnesiac-apk-signer.sh
          ./run.sh build-androidapp

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitVow-signed.apk
          path: artifacts/signed-release-app.apk
