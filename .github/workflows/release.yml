name: Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release new version?"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  test-contract:
    name: Run Contract Tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: npm ci
      - name: Run Hardhat tests
        run: npm run test

  build-apk:
    name: Build Signed* APK
    needs: deploy-contract-sepolia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download contract addresses artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-addresses
          path: contracts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Build and sign APK via run.sh
        shell: bash
        run: |
          set -euo pipefail
          # Ensure apksigner from build-tools is on PATH
          export PATH="$ANDROID_SDK_ROOT/build-tools/35.0.0:$PATH"
          chmod +x run.sh @androidapp/app/amnesiac-apk-signer.sh
          ./run.sh build-androidapp

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitVow-signed.apk
          path: artifacts/signed-release-app.apk

  deploy-contract-sepolia:
    name: Deploy Contracts (Sepolia)
    needs: test-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env for Sepolia deploy
        run: |
          {
            echo "sepolia.WALLET_PRIVATE_KEY=${{ secrets.SEPOLIA_WALLET_PRIVATE_KEY }}";
            echo "sepolia.RPC_URL=${{ secrets.SEPOLIA_RPC_URL }}";
            echo "sepolia.ETHERSCAN.API_KEY=${{ secrets.SEPOLIA_ETHERSCAN_API_KEY }}";
          } > .env

      - name: Deploy to Sepolia
        run: |
          chmod +x run.sh
          ./run.sh deploy sepolia

      - name: Upload contract addresses artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-addresses
          path: contracts/.addresses
          include-hidden-files: true

  deploy-webapp:
    name: Deploy Frontend
    needs: deploy-contract-sepolia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download contract addresses artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-addresses
          path: contracts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            @website/package-lock.json

      - name: Install website dependencies
        working-directory: '@website'
        run: npm ci

      - name: Build website
        working-directory: '@website'
        run: |
          mkdir -p public
          cp ../contracts/.addresses public/addresses
          npm run build

      - name: Configure AWS credentials (OIDC recommended)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy static site to S3
        run: |
          chmod +x run.sh
          ./run.sh deploy-webapp
